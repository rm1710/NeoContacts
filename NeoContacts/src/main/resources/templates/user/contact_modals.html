                        <div class="md:w-2/5 flex flex-col items-center text-center">

                            </p>
                        </div>

                        <div class="md:w-full rounded-xl p-6

                            <div class="space-y-5 text-sm">

                                <div class="flex justify-between items-start">

                                    </span>
                                    <span id="contact_phone" class="text-gray-900 dark:text-gray-100 text-right">

                                </div>

                                <div class="flex justify-between items-start">
                                    <span class="font-medium text-gray-600 dark:text-gray-300">

                                    </span>
                                    <span id="contact_address" class="text-gray-900 dark:text-gray-100 text-right">
                                    </span>
                                </div>

                                <div class="flex justify-between items-start">
                                    <span class="font-medium text-gray-600 dark:text-gray-300">
                                        Website
                                    </span>
                                    <span id="contact_website" class="text-blue-600 dark:text-blue-400
                                                 hover:underline text-right break-all">
                                    </span>
                                </div>

                                <div class="flex justify-between items-start">
                                    <span class="font-medium text-gray-600 dark:text-gray-300">

                                    </span>
                                    <span id="contact_linkedin" class="text-blue-600 dark:text-blue-400
                                                 hover:underline text-right break-all">
                                    </span>
                                </div>

                                <div class="pt-4 border-t border-gray-200 dark:border-slate-700">
                                    <span class="block font-medium text-gray-600 dark:text-gray-300 mb-1">
                                        Notes
                                    </span>
                                    <span id="contact_notes" class="block text-gray-700 dark:text-gray-200
                                                 text-right whitespace-pre-line">
                                    </span>
                                </div>

                            </div>
                        </div>

                    </div>
