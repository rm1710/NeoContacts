<aside data-th-fragment="sidebar" id="logo-sidebar"
  class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform
         -translate-x-full sm:translate-x-0
         bg-gradient-to-b from-pink-200 via-purple-200 to-indigo-300
         dark:from-slate-900 dark:via-slate-800 dark:to-indigo-950
         border-r border-purple-400 dark:border-slate-700
         shadow-2xl"
  aria-label="Sidebar">

  <div class="h-full pt-16 px-4 py-6 overflow-y-auto">

    <!-- Profile / Welcome Section -->
    <a href="https://flowbite.com/"
       class="flex flex-col items-center mb-10 text-center">

      <img
        onerror="this.onerror=null; this.src='https://flowbite.com/docs/images/logo.svg'"
        data-th-src="@{${loggedInUser.profilePic}}"
        src="https://flowbite.com/docs/images/logo.svg"
        class="h-20 sm:h-24 rounded-full
               ring-4 ring-purple-500 dark:ring-indigo-600
               shadow-lg hover:scale-105 transition duration-300"
        alt="Profile Image" />

      <span
        class="mt-3 text-sm font-semibold text-gray-900 dark:text-gray-300"
        data-th-text="${loggedInUser.name}">
        Ritesh Mishra
      </span>

      <span
        class="mt-1  font-bold
               bg-gradient-to-r from-purple-700 to-pink-700
               dark:from-indigo-400 dark:to-purple-400
               bg-clip-text">
        Welcome to NeoContacts
      </span>
    </a>

    <!-- Menu -->
    <ul class="space-y-2 font-medium">

      <!-- Dashboard -->
      <li>
        <a data-th-href="@{'/user/dashboard'}"
           class="relative flex items-center p-3 pl-5 rounded-xl
                  text-gray-900 dark:text-gray-200
                  hover:bg-pink-300 dark:hover:bg-slate-700
                  hover:text-purple-800 dark:hover:text-white
                  transition-all duration-300 group

                  before:absolute before:left-0 before:top-2 before:bottom-2
                  before:w-1 before:rounded-r-lg
                  before:bg-purple-700 dark:before:bg-indigo-400
                  before:scale-y-0 before:origin-center
                  before:transition-transform before:duration-300
                  hover:before:scale-y-100">

          <svg class="w-5 h-5 text-purple-700 dark:text-indigo-300"
               fill="currentColor" viewBox="0 0 22 21">
            <path d="M16.975 11H10V4.025a1 1 0 0 0-1.066-.998
                     8.5 8.5 0 1 0 9.039 9.039
                     .999.999 0 0 0-1-1.066h.002Z"/>
            <path d="M12.5 0A8.51 8.51 0 0 0 11 1.02V10h8.975
                     a1 1 0 0 0 1-.935
                     A8.51 8.51 0 0 0 12.5 0Z"/>
          </svg>

          <span class="ms-3">Dashboard</span>
        </a>
      </li>

      <!-- Profile -->
      <li>
        <a data-th-href="@{'/user/profile'}"
           class="relative flex items-center p-3 pl-5 rounded-xl
                  text-gray-900 dark:text-gray-200
                  hover:bg-pink-300 dark:hover:bg-slate-700
                  hover:text-purple-800 dark:hover:text-white
                  transition-all duration-300 group

                  before:absolute before:left-0 before:top-2 before:bottom-2
                  before:w-1 before:rounded-r-lg
                  before:bg-purple-700 dark:before:bg-indigo-400
                  before:scale-y-0 before:origin-center
                  before:transition-transform before:duration-300
                  hover:before:scale-y-100">

          <i class="fa-solid fa-user w-5 h-5 text-purple-700 dark:text-indigo-300"></i>

          <span class="ms-3 flex-1">Profile</span>

          <span
            class="px-3 py-0.5 text-xs font-semibold rounded-full
                   bg-pink-300 text-pink-900
                   dark:bg-emerald-900 dark:text-emerald-300">
            Manage
          </span>
        </a>
      </li>

      <!-- Add Contact -->
      <li>
        <a data-th-href="@{'/user/contacts/add'}"
           class="relative flex items-center p-3 pl-5 rounded-xl
                  text-gray-900 dark:text-gray-200
                  hover:bg-pink-300 dark:hover:bg-slate-700
                  hover:text-purple-800 dark:hover:text-white
                  transition-all duration-300 group

                  before:absolute before:left-0 before:top-2 before:bottom-2
                  before:w-1 before:rounded-r-lg
                  before:bg-purple-700 dark:before:bg-indigo-400
                  before:scale-y-0 before:origin-center
                  before:transition-transform before:duration-300
                  hover:before:scale-y-100">

          <i class="fa-solid fa-plus w-5 h-5 text-purple-700 dark:text-indigo-300"></i>

          <span class="ms-3">Add Contact</span>
        </a>
      </li>

      <!-- Contacts -->
      <li>
        <a data-th-href="@{'/user/contacts'}"
           class="relative flex items-center p-3 pl-5 rounded-xl
                  text-gray-900 dark:text-gray-200
                  hover:bg-pink-300 dark:hover:bg-slate-700
                  hover:text-purple-800 dark:hover:text-white
                  transition-all duration-300 group

                  before:absolute before:left-0 before:top-2 before:bottom-2
                  before:w-1 before:rounded-r-lg
                  before:bg-purple-700 dark:before:bg-indigo-400
                  before:scale-y-0 before:origin-center
                  before:transition-transform before:duration-300
                  hover:before:scale-y-100">

          <i class="fa-regular fa-address-book w-5 h-5 text-purple-700 dark:text-indigo-300"></i>

          <span class="ms-3">My Contacts</span>
        </a>
      </li>

      <!-- Logout -->
      <li>
        <a href="#"
           class="relative flex items-center p-3 pl-5 rounded-xl
                  text-red-700 dark:text-red-400
                  hover:bg-red-300 dark:hover:bg-red-900
                  transition-all duration-300

                  before:absolute before:left-0 before:top-2 before:bottom-2
                  before:w-1 before:rounded-r-lg
                  before:bg-red-700 dark:before:bg-red-400
                  before:scale-y-0 before:origin-center
                  before:transition-transform before:duration-300
                  hover:before:scale-y-100">

          <i class="fa-solid fa-right-from-bracket w-5 h-5"></i>

          <span class="ms-3">Logout</span>
        </a>
      </li>

    </ul>
  </div>
</aside>
