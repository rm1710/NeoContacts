<!DOCTYPE html>
<html lang="en" data-th-replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">

<head>
    <title>All Contacts</title>
</head>

<body>
    <div id="content" class="min-h-screen
     bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50
     dark:from-slate-900 dark:via-slate-800 dark:to-slate-900">

        <!-- Sidebar -->
        <div data-th-if="${loggedInUser}">
            <div data-th-replace="~{user/sidebar :: sidebar}"></div>
        </div>

        <!-- Main Content -->
        <div class="sm:pl-64 px-4 py-8">

            <div class="max-w-7xl mx-auto space-y-8">

                <!-- Heading -->
                <h1 class="text-4xl md:text-5xl font-bold text-center
                       text-gray-800 dark:text-gray-100">
                    All Your Contacts
                </h1>

                <!-- Card -->
                <div class="backdrop-blur-lg bg-white/70 dark:bg-slate-800/70
                        rounded-2xl shadow-xl border border-white/30">
                    <div data-th-replace="~{message::messagebox}"></div>

                    <!-- 🔍 Search Form -->
                    <form data-th-object="${contactSearchForm}" data-th-action="@{/user/contacts/search}" method="get"
                        class="p-6">



                        <div class="flex flex-col md:flex-row gap-4">

                            <select data-th-field="*{field}" class="h-11 px-3 rounded-lg border
                                bg-white dark:bg-slate-700
                                text-gray-700 dark:text-gray-200
                                focus:ring-2 focus:ring-indigo-500">
                                <option value="">Select Field</option>
                                <option value="name">Name</option>
                                <option value="phone">Phone</option>
                                <option value="email">Email</option>
                            </select>

                            <input data-th-field="*{keyword}" type="text" placeholder="Search contact..." class="h-11 w-full rounded-lg border
                               flex-1
                               bg-white dark:bg-slate-700
                               text-gray-700 dark:text-gray-200
                               focus:ring-2 focus:ring-indigo-500">

                            <button type="submit" class="h-11 px-6 rounded-lg
                                bg-gradient-to-r from-indigo-600 to-purple-600
                                text-white font-medium
                                hover:from-indigo-700 hover:to-purple-700
                                transition shadow-md">
                                Search
                            </button>

                        </div>
                    </form>

                    <!-- 📋 Table -->
                    <div class="overflow-x-auto">
                        <table data-th-if="${pageContact.totalElements>0}" class="w-full text-sm text-left">

                            <thead class="bg-indigo-100 dark:bg-slate-700 text-gray-700 dark:text-gray-200">
                                <tr>
                                    <th class="px-6 py-4">Name</th>
                                    <th class="px-6 py-4">Phone</th>
                                    <th class="px-6 py-4">Links</th>
                                    <th class="px-6 py-4">Action</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr data-th-each="c : ${pageContact.content}" data-th-object="${c}" class="border-b
                            hover:bg-indigo-50 dark:hover:bg-slate-700
                            transition">
                                    <td class="px-6 py-4">
                                        <div class="flex items-center gap-4">

                                            <!-- Profile Image -->
                                            <img data-th-src="*{picture}" alt="Profile Image" class="w-12 h-12 rounded-full object-cover
                    ring-2 ring-indigo-400">

                                            <!-- Text Content -->
                                            <div class="flex flex-col">
                                                <div class="flex items-center gap-2">
                                                    <span class="font-semibold" data-th-text="*{name}"></span>
                                                    <i data-th-if="*{favorite}"
                                                        class="fa-solid fa-heart text-green-500"></i>
                                                </div>

                                                <div class="text-xs text-gray-500" data-th-text="*{email}"></div>
                                            </div>

                                        </div>
                                    </td>


                                    <td class="px-6 py-4">
                                        <span data-th-text="*{phoneNumber}"></span>
                                    </td>

                                    <td class="px-6 py-4">
                                        <div class="flex gap-4 text-lg">
                                            <a data-th-href="*{websiteLink}"
                                                class="text-indigo-500 hover:scale-110 transition">
                                                <i class="fa-solid fa-link"></i>
                                            </a>
                                            <a data-th-href="*{linkedInLink}" target="_blank"
                                                class="text-sky-600 hover:scale-110 transition">
                                                <i class="fa-brands fa-linkedin"></i>
                                            </a>
                                        </div>
                                    </td>

                                    <td class="px-6 py-4">
                                        <div class="flex gap-4 text-lg">
                                            <button data-th-onclick="deleteContact([[${c.id}]])">
                                                <i class="fa-solid w-6 h-6 fa-trash"></i>
                                            </button>
                                            <!-- update contact -->
                                            <a 
                                            data-th-href="@{'/user/contacts/view/'+*{id}}" class="text-indigo-500 hover:scale-110 transition">
                                                <i class="fa-solid fa-pen-to-square"></i>
                                            </a>
                                            <button th:onclick="loadContactdata([[${c.id}]])"
                                                class="text-gray-600 hover:scale-110 transition">
                                                <i class="fa-solid fa-eye"></i>
                                            </button>
                                        </div>
                                    </td>

                                </tr>
                            </tbody>

                        </table>
                    </div>

                    <!-- 📄 Pagination -->
                    <div data-th-if="${pageContact.totalElements > 0}" class="p-6 flex justify-center">

                        <ul class="inline-flex rounded-lg overflow-hidden border">

                            <li data-th-unless="${pageContact.first}">
                                <a class="px-4 py-2 hover:bg-indigo-100 transition" data-th-href="@{/user/contacts(size=${pageSize},page=${pageContact.number - 1},
                               field=${contactSearchForm?.field},keyword=${contactSearchForm?.keyword})}">
                                    Previous
                                </a>
                            </li>

                            <li data-th-each="i : ${#numbers.sequence(0, pageContact.totalPages - 1)}">
                                <a data-th-href="@{/user/contacts(size=${pageSize},page=${i},
                               field=${contactSearchForm?.field},keyword=${contactSearchForm?.keyword})}"
                                    data-th-classappend="${i == pageContact.number}
                               ? ' bg-indigo-500 text-white'
                               : ' hover:bg-indigo-100'" class="px-4 py-2 transition">
                                    <span data-th-text="${i + 1}"></span>
                                </a>
                            </li>

                            <li data-th-unless="${pageContact.last}">
                                <a class="px-4 py-2 hover:bg-indigo-100 transition" data-th-href="@{/user/contacts(size=${pageSize},page=${pageContact.number + 1},
                               field=${contactSearchForm?.field},keyword=${contactSearchForm?.keyword})}">
                                    Next
                                </a>
                            </li>

                        </ul>
                    </div>

                    <h1 data-th-if="${pageContact.totalElements==0}"
                        class="text-3xl font-semibold text-center p-10 text-gray-600">
                        No result found
                    </h1>

                </div>
            </div>

            <div data-th-replace="~{user/contact_modals :: contact}"></div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script data-th-src="@{'/js/contacts.js'}"></script>
</body>

</html>
