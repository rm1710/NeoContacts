<!DOCTYPE html>
<html lang="en" th:replace="~{base:: parent(~{::#content},~{::title},~{::script})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="content">
        <div class="grid grid-cols-12">
            <div class="col-span-4 md:col-span-2 lg:col-span-3 xl:col-span-4"></div>

            <div class="col-span-12 md:col-span-8 lg:col-span-6 xl:col-span-4">
                <div class="block p-6 border-t-[10px] border-blue-700 bg-white rounded-xl shadow
                           hover:bg-gray-100 dark:bg-gray-800 dark:border-blue-700 dark:hover:bg-gray-700">

                    <h5 class="mb-3 text-2xl font-semibold tracking-tight leading-8 text-gray-900 dark:text-white">
                        Sign Up
                    </h5>
                    <p class="font-normal text-gray-400">
                        start managing contacts on cloud...
                    </p>

                    <form data-th-action="@{'/do-register'}" method="post" data-th-object="${userForm}" class="mt-5">

                        <!-- Name -->
                        <div class="mb-3">
                            <label for="name" class="block mb-2.5 text-sm font-medium text-gray-700 dark:text-gray-300">
                                Name
                            </label>
                            <input type="text" id="name" data-th:field="*{name}" class="bg-white dark:bg-gray-700
                                          border border-gray-300 dark:border-gray-600
                                          text-gray-900 dark:text-white
                                          text-sm rounded-lg
                                          focus:ring-blue-500 focus:border-blue-500
                                          block w-full px-3 py-2.5" placeholder="name" required />
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email"
                                class="block mb-2.5 text-sm font-medium text-gray-700 dark:text-gray-300">
                                Your email
                            </label>
                            <input type="email" id="email" data-th:field="*{email}" class="bg-white dark:bg-gray-700
                                          border border-gray-300 dark:border-gray-600
                                          text-gray-900 dark:text-white
                                          text-sm rounded-lg
                                          focus:ring-blue-500 focus:border-blue-500
                                          block w-full px-3 py-2.5" placeholder="name@example.com" required />
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password"
                                class="block mb-2.5 text-sm font-medium text-gray-700 dark:text-gray-300">
                                Password
                            </label>
                            <input type="password" id="password" data-th:field="*{password}" class="bg-white dark:bg-gray-700
                                          border border-gray-300 dark:border-gray-600
                                          text-gray-900 dark:text-white
                                          text-sm rounded-lg
                                          focus:ring-blue-500 focus:border-blue-500
                                          block w-full px-3 py-2.5" placeholder="password" required />
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label for="phone"
                                class="block mb-2.5 text-sm font-medium text-gray-700 dark:text-gray-300">
                                Contact Number
                            </label>
                            <input type="text" id="phone" data-th:field="*{phoneNumber}" class="bg-white dark:bg-gray-700
                                          border border-gray-300 dark:border-gray-600
                                          text-gray-900 dark:text-white
                                          text-sm rounded-lg
                                          focus:ring-blue-500 focus:border-blue-500
                                          block w-full px-3 py-2.5" placeholder="Contact Number" required />
                        </div>

                        <!-- About -->
                        <div class="mb-3">
                            <label for="about" class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
                                Write something about yourself
                            </label>
                            <textarea id="about" rows="6" data-th:field="*{about}" class="bg-white dark:bg-gray-700
                                             border border-gray-300 dark:border-gray-600
                                             text-gray-900 dark:text-white
                                             text-sm rounded-lg
                                             focus:ring-blue-500 focus:border-blue-500
                                             block w-full px-3 py-2.5" placeholder="write your thoughts here..."
                                required></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="mb-3 flex justify-center space-x-3">
                            <button type="submit" class="px-4 py-2 rounded bg-gray-800 text-white
                                           hover:bg-gray-900 dark:bg-blue-900 dark:hover:bg-blue-800">
                                signup
                            </button>

                            <button type="reset" class="px-4 py-2 rounded bg-orange-700 text-white
                                           hover:bg-orange-800 dark:bg-orange-600 dark:hover:bg-orange-700">
                                reset
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:fragment="script">
        <script src="/js/script.js"></script>
    </div>
</body>

</html>
